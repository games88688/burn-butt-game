<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>拿烟头烫他的屁股 · V0.2</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#fff7ef;color:#30251e;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}#app{max-width:680px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);gap:12px}header{text-align:center}h1{font-size:clamp(24px,6vw,36px);margin:8px 0 2px}.sub{color:#947f71;font-size:14px}#arena{height:min(52dvh,440px);min-height:270px;border:2px solid #ebd9c7;border-radius:26px;background:linear-gradient(#ffedda,#fff9ef);position:relative;overflow:hidden;touch-action:none;cursor:crosshair}#arena:before{content:' ';position:absolute;bottom:0;left:0;right:0;height:22%;background:#e7f1d7;border-top:3px solid #d1e2b8}#enemy{position:absolute;left:55%;top:48%;transform:translate(-50%,-50%);width:100px;height:156px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:left .19s ease,top .19s ease;user-select:none;pointer-events:none;filter:drop-shadow(0 5px 3px #0002)}.face{font-size:73px;line-height:1}.body{font-size:60px;line-height:1;margin-top:-8px}.tag{font-size:12px;font-weight:bold;background:white;border:1px solid #ecd9c5;border-radius:20px;padding:3px 10px}.bubble{position:absolute;z-index:5;left:50%;top:12%;transform:translateX(-50%);max-width:90%;padding:11px 17px;border-radius:20px;background:#fff;box-shadow:0 3px 12px #6b463521;font-weight:700;text-align:center;display:none}.spark{position:absolute;pointer-events:none;font-size:36px;animation:pop .6s ease forwards}@keyframes pop{to{opacity:0;transform:translateY(-35px) scale(1.5)}}#hint{position:absolute;bottom:15px;width:100%;text-align:center;font-size:13px;color:#6d795b}.panel{background:white;border:2px solid #f0e0d2;border-radius:22px;padding:15px;display:grid;gap:14px}.row{display:flex;align-items:center;gap:12px}.row label{min-width:74px;font-size:14px;font-weight:700}.row input[type=range]{flex:1;accent-color:#e88d62}.value{min-width:45px;text-align:right;color:#93776a;font-size:13px}.buttons{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;border:0;border-radius:15px;padding:12px 16px;background:#322720;color:white;font-weight:700;cursor:pointer;flex:1}button.secondary{background:#f6e6d9;color:#4e3529}button:active{transform:scale(.98)}#overlay{position:fixed;inset:0;background:#fff8efed;display:grid;place-items:center;z-index:10;padding:22px}.welcome{background:white;border:2px solid #eddbca;border-radius:30px;padding:34px 24px;text-align:center;max-width:430px;width:100%}.welcome .logo{font-size:64px}.welcome h2{font-size:27px;margin:12px 0}.welcome p{color:#937e70;line-height:1.7}.welcome button{margin-top:15px;width:100%}small{color:#98897e;text-align:center;line-height:1.5}select{font:inherit;border:1px solid #e8d7c8;background:#fff8f1;border-radius:10px;padding:8px;max-width:100%;flex:1}
</style></head><body><div id="app"><header><h1>🔥🍑 拿烟头烫他的屁股</h1><div class="sub">V0.2 · 卡通荒诞解压实验室 · 无计分、无输赢</div></header><div id="arena"><div class="bubble" id="bubble"></div><div id="enemy"><div class="face" id="face">😏</div><div class="body">🕺</div><div class="tag" id="enemyName">嘴硬怪</div></div><div id="hint">用手指点他附近，看看他怎么躲！✨</div></div><div class="panel"><div class="row"><label for="name">角色名字</label><input id="name" style="flex:1;min-width:0;border:1px solid #e8d7c8;border-radius:10px;padding:10px" value="嘴硬怪" maxlength="18"></div><div class="row"><label for="pitch">男声音高</label><input id="pitch" type="range" min="0.55" max="1.15" step="0.05" value="0.75"><span class="value" id="pitchV">0.75×</span></div><div class="row"><label for="speed">语速</label><input id="speed" type="range" min="0.7" max="1.4" step="0.1" value="1"><span class="value" id="speedV">1.0×</span></div><div class="row"><label for="voice">语音选择</label><select id="voice"><option value="">系统中文语音（低音）</option></select></div><div class="buttons"><button class="secondary" id="test">🔊 试听男声</button><button class="secondary" id="toggle">🔈 声音：开</button><button id="again">🔄 重新开始</button></div></div><small>四句台词随机触发；语音音色由浏览器及设备的语音库决定。<br>纯卡通闹剧，没有真实伤害画面。</small></div><div id="overlay"><div class="welcome"><div class="logo">🔥🍑</div><h2>拿烟头烫他的屁股</h2><p>他跑，你追。纯卡通荒诞小游戏。<br>没有命中率，也没有任何绩效考核。</p><button id="start">开始追他！</button></div></div><script>
(()=>{'use strict';const $=s=>document.querySelector(s),arena=$('#arena'),enemy=$('#enemy'),bubble=$('#bubble'),face=$('#face');let active=false,muted=false,last=0,voices=[];const lines=['对不起，我错了！','啊！疼死我了！','你以为你有多厉害？','别用烟头烫我的屁股了！！'];function loadVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices().filter(v=>/^zh/i.test(v.lang));const select=$('#voice'),prev=select.value;select.innerHTML='<option value="">系统中文语音（低音）</option>';voices.forEach((v,i)=>{const o=document.createElement('option');o.value=i;o.textContent=v.name+' ('+v.lang+')';select.appendChild(o)});select.value=prev||''}if('speechSynthesis'in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}function speak(t){if(muted||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.pitch=Number($('#pitch').value);u.rate=Number($('#speed').value);const chosen=$('#voice').value;if(chosen!==''&&voices[Number(chosen)])u.voice=voices[Number(chosen)];else{const male=voices.find(v=>/male|男|yunxi|yunjian|kangkang|danny|eddy/i.test(v.name));if(male)u.voice=male}speechSynthesis.speak(u)}catch(e){}}function say(t){bubble.textContent=t;bubble.style.display='block';clearTimeout(say.timer);say.timer=setTimeout(()=>bubble.style.display='none',1800);speak(t)}function move(x,y){const r=arena.getBoundingClientRect(),w=r.width,h=r.height;enemy.style.left=Math.max(65,Math.min(w-65,x))+'px';enemy.style.top=Math.max(88,Math.min(h-76,y))+'px'}function chase(e){if(!active)return;const now=performance.now();if(now-last<280)return;last=now;const r=arena.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,er=enemy.getBoundingClientRect(),ex=er.left+er.width/2-r.left,ey=er.top+er.height/2-r.top;const dist=Math.hypot(x-ex,y-ey);if(dist<130){const t=lines[Math.floor(Math.random()*lines.length)];say(t);face.textContent=Math.random()<.5?'😱':'😤';const fx=document.createElement('div');fx.className='spark';fx.textContent='✨';fx.style.left=x+'px';fx.style.top=y+'px';arena.appendChild(fx);setTimeout(()=>fx.remove(),600)}else{face.textContent='😏'}move(70+Math.random()*(r.width-140),90+Math.random()*(r.height-180))}arena.addEventListener('pointerdown',chase);arena.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')chase(e)});$('#start').onclick=()=>{$('#overlay').style.display='none';active=true;move(arena.clientWidth*.55,arena.clientHeight*.5);say('你以为你有多厉害？')};$('#again').onclick=()=>{active=true;face.textContent='😏';move(arena.clientWidth*.55,arena.clientHeight*.5);say('你以为你有多厉害？')};$('#test').onclick=()=>speak('你以为你有多厉害？');$('#toggle').onclick=()=>{muted=!muted;$('#toggle').textContent=muted?'🔇 声音：关':'🔈 声音：开';if(muted&&'speechSynthesis'in window)speechSynthesis.cancel()};$('#name').oninput=e=>$('#enemyName').textContent=e.target.value||'嘴硬怪';for(const id of ['pitch','speed'])$('#'+id).oninput=e=>$('#'+id+'V').textContent=Number(e.target.value).toFixed(id==='pitch'?2:1)+'×';window.addEventListener('resize',()=>{if(active)move(arena.clientWidth*.55,arena.clientHeight*.5)})})();
</script></body></html>
