<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>拿烟头烫他的屁股 V0.3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#fff7ef;color:#302821}button,input{font:inherit}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{height:82px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:21px;margin:0}.sub{font-size:12px;color:#88796d}.stats{display:flex;gap:6px}.pill{background:#fff;border:1px solid #eaded2;border-radius:15px;padding:6px 9px;text-align:center;min-width:55px}.pill b{display:block}.pill span{font-size:10px;color:#8b7c70}
#arena{position:relative;flex:1;border-radius:28px;overflow:hidden;background:linear-gradient(#f8e9d9 0 72%,#e7cda9 72%);border:1px solid #ead8c5;touch-action:none}#hint{position:absolute;top:15px;left:50%;transform:translateX(-50%);background:#ffffffd9;padding:8px 13px;border-radius:999px;font-size:12px;color:#79685a;z-index:8;white-space:nowrap}
#enemy{position:absolute;width:96px;height:150px;left:60%;top:50%;transform:translate(-50%,-50%);z-index:3}.head{position:absolute;width:55px;height:55px;border-radius:50%;background:#f0c8a5;left:20px;top:2px;border:2px solid #3a3029}.hair{position:absolute;width:57px;height:27px;background:#382d27;border-radius:30px 30px 10px 10px;left:19px;top:0}.eye{position:absolute;width:4px;height:4px;border-radius:50%;background:#302821;top:28px}.eye.l{left:34px}.eye.r{left:55px}.mouth{position:absolute;left:43px;top:40px;width:12px;height:5px;border-bottom:2px solid #302821}.body{position:absolute;left:27px;top:53px;width:43px;height:55px;background:#687d6b;border:2px solid #302821;border-radius:12px}.arm{position:absolute;width:14px;height:54px;background:#f0c8a5;border:2px solid #302821;border-radius:9px;top:58px}.arm.l{left:18px;transform:rotate(15deg)}.arm.r{right:17px;transform:rotate(-15deg)}.leg{position:absolute;width:17px;height:50px;background:#59606c;border:2px solid #302821;top:103px;border-radius:8px}.leg.l{left:28px}.leg.r{right:27px}#butt{position:absolute;left:25px;top:93px;width:47px;height:30px;border-radius:50%;background:#df8d8d;border:2px solid #302821;z-index:5}#butt:after{content:"";position:absolute;left:50%;top:4px;bottom:4px;border-left:1px solid #7c4545}.name{position:absolute;top:-23px;width:100%;text-align:center;font-size:12px;font-weight:750;background:#fff9;border-radius:999px}
#tool{position:absolute;width:78px;height:26px;left:40px;top:120px;z-index:10;pointer-events:none}.cig{position:absolute;left:0;top:7px;width:62px;height:12px;background:#f7f2e8;border:1px solid #b9aa98;border-radius:6px}.filter{position:absolute;left:45px;top:7px;width:20px;height:12px;background:#d9a45f;border:1px solid #9c7040}.ember{position:absolute;left:-5px;top:5px;width:13px;height:16px;background:#ff7043;border-radius:50%;box-shadow:0 0 12px #ff3d00,0 0 25px #ff9800}#fx,#cry{position:absolute;z-index:15;pointer-events:none;opacity:0;font-weight:900;font-size:28px}.pop{animation:pop .55s ease-out}@keyframes pop{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{opacity:0;transform:translateY(-35px)}}.hit{animation:jump .38s ease-out}@keyframes jump{35%{transform:translate(-50%,-75%) rotate(12deg)}}
#controls{padding:10px 3px 4px}.row{display:grid;grid-template-columns:75px 1fr 48px;align-items:center;gap:7px;margin:7px 0;font-size:12px}input[type=range]{width:100%;accent-color:#a85d55}.value{text-align:right;color:#8c7666}.buttons{display:flex;gap:8px}button{border:0;border-radius:15px;padding:11px;font-weight:750;background:#302821;color:white;flex:1}.secondary{background:#efe3d6;color:#594a3e}.tiny{font-size:10px;color:#9a8b7e;text-align:center;margin-top:4px}
#overlay{position:fixed;inset:0;background:#fff7ef;display:flex;align-items:center;justify-content:center;z-index:50;padding:28px}.card{width:min(440px,100%);background:white;border:1px solid #eaded2;border-radius:30px;padding:28px;text-align:center}.logo{font-size:60px}.card h2{font-size:27px;margin:8px}.card p{color:#8b7c70;font-size:14px}.card input{width:100%;border:1px solid #ddcfc1;background:#fffaf5;border-radius:14px;padding:12px;margin:10px 0 14px;text-align:center}
</style></head><body>
<div id="overlay"><div class="card"><div class="logo">🔥🍑</div><h2>拿烟头烫他的屁股</h2><p>他跑，你追。纯卡通荒诞小游戏。</p><input id="nameInput" maxlength="12" value="倒霉蛋"><button id="startBtn">开始追他</button></div></div>
<div id="app"><header><div><h1>🔥 拿烟头烫他的屁股</h1><div class="sub">V0.3 · 卡通泄愤实验室</div></div></header>
<main id="arena"><div id="hint">用手指拖着烟头追他</div><div id="enemy"><div class="name" id="enemyName">倒霉蛋</div><div class="head"></div><div class="hair"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div><div class="arm l"></div><div class="arm r"></div><div class="body"></div><div id="butt"></div><div class="leg l"></div><div class="leg r"></div></div><div id="tool"><div class="cig"></div><div class="filter"></div><div class="ember"></div></div><div id="fx">💨</div><div id="cry">啊！</div></main>
<section id="controls"><div class="row"><b>惨叫音高</b><input id="pitch" type="range" min=".55" max="1.9" value="0.7" step=".05"><span class="value" id="pitchV">0.70×</span></div><div class="row"><b>逃跑速度</b><input id="speed" type="range" min="1" max="5" value="3"><span class="value" id="speedV">3</span></div><div class="row" style="grid-template-columns:75px 1fr"><b>语音音色</b><select id="voiceSelect" style="width:100%;min-width:0;padding:7px;border-radius:10px;border:1px solid #ddcfc1;background:#fffaf5"><option value="">系统中文语音</option></select></div><div class="buttons"><button class="secondary" id="voiceBtn">🔊 试听台词</button><button id="resetBtn">重新开始</button></div><div class="tiny">优先选择可用的男性语音；若设备没有男性中文语音，需要额外的男声录音才能保证音色。</div></section></div>
<script>
const $=s=>document.querySelector(s),arena=$('#arena'),enemy=$('#enemy'),tool=$('#tool'),fx=$('#fx'),cry=$('#cry'),pitch=$('#pitch'),speed=$('#speed');let lastHit=0,started=false,ex=300,ey=220,vx=1.2,vy=.8,tx=45,ty=130,active=false;
const lines=['对不起，我错了！','啊！疼死我了！','你以为你有多厉害？','别用烟头烫我的屁股了！！'];
let voices=[];
function updateVoices(){
 if(!('speechSynthesis' in window))return;
 voices=speechSynthesis.getVoices().filter(v=>/^zh|Chinese|Mandarin/i.test(v.lang+' '+v.name));
 let sel=$('#voiceSelect'),old=sel.value;
 sel.innerHTML='';
 voices.forEach((v,i)=>{let o=document.createElement('option');o.value=String(i);o.textContent=v.name+' ('+v.lang+')';sel.appendChild(o)});
 if(!voices.length){let o=document.createElement('option');o.textContent='系统默认中文语音';o.value='';sel.appendChild(o)}
 let preferred=voices.findIndex(v=>/male|男|yunxi|yunjian|yunyang|kangkang|danny|eddy|aaron|li-mu|li mu/i.test(v.name)&&!/female|女/i.test(v.name));
 sel.value=old&&voices[Number(old)]?old:String(Math.max(0,preferred));
}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=updateVoices;updateVoices();setTimeout(updateVoices,400)}
function scream(){
 if(!('speechSynthesis' in window))return;
 speechSynthesis.cancel();
 let line=lines[Math.floor(Math.random()*lines.length)],u=new SpeechSynthesisUtterance(line);
 u.lang='zh-CN';u.rate=1.06;u.pitch=Number(pitch.value);
 let selected=voices[Number($('#voiceSelect').value)];if(selected)u.voice=selected;
 speechSynthesis.speak(u);return line;
}
function pop(el,x,y){el.style.left=x+'px';el.style.top=y+'px';el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
function hit(x,y){let n=performance.now();if(n-lastHit<650)return;lastHit=n;let spoken=scream();enemy.classList.remove('hit');void enemy.offsetWidth;enemy.classList.add('hit');pop(fx,x,y);cry.textContent='💥';pop(cry,x+10,y-25);vx*=-2;vy*=-2}
function pos(e){let r=arena.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
function move(e){e.preventDefault();active=true;$('#hint').style.opacity=.2;let p=pos(e);tx=p.x;ty=p.y;tool.style.left=(tx-7)+'px';tool.style.top=(ty-13)+'px'}
arena.addEventListener('pointerdown',move);arena.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});arena.addEventListener('touchstart',move,{passive:false});arena.addEventListener('touchmove',move,{passive:false});
function loop(){if(started){let r=arena.getBoundingClientRect(),dx=ex-tx,dy=ey-ty,d=Math.hypot(dx,dy),s=+speed.value;if(active&&d<190){let f=(190-d)/190*(.22+s*.08);vx+=dx/(d||1)*f;vy+=dy/(d||1)*f;}else{vx+=(Math.random()-.5)*.06;vy+=(Math.random()-.5)*.06}let m=1.2+s*.55,q=Math.hypot(vx,vy);if(q>m){vx=vx/q*m;vy=vy/q*m}ex+=vx;ey+=vy;if(ex<55){ex=55;vx=Math.abs(vx)}if(ex>r.width-55){ex=r.width-55;vx=-Math.abs(vx)}if(ey<90){ey=90;vy=Math.abs(vy)}if(ey>r.height-80){ey=r.height-80;vy=-Math.abs(vy)}enemy.style.left=ex+'px';enemy.style.top=ey+'px';if(Math.hypot(tx-ex,ty-(ey+18))<31)hit(ex,ey+18)}requestAnimationFrame(loop)}loop();
pitch.oninput=()=>$('#pitchV').textContent=(+pitch.value).toFixed(2)+'×';speed.oninput=()=>$('#speedV').textContent=speed.value;$('#voiceBtn').onclick=scream;$('#resetBtn').onclick=()=>{active=false;tx=-1000;ty=-1000;let r=arena.getBoundingClientRect();ex=r.width*.62;ey=r.height*.52;vx=1.2;vy=.8};$('#startBtn').onclick=()=>{$('#enemyName').textContent=$('#nameInput').value.trim()||'倒霉蛋';$('#overlay').style.display='none';started=true;let r=arena.getBoundingClientRect();ex=r.width*.62;ey=r.height*.52};
</script></body></html>
